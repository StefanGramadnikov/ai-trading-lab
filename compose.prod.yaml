# Production-shaped Compose for the V0 paper run on one small server. PAPER ONLY.
#
#   docker compose -f compose.prod.yaml --env-file /opt/atl/.env.prod up -d --build
#
# The only published port is the dashboard, bound to the server's own loopback (127.0.0.1:8000): it is
# reachable from your Mac only through an SSH tunnel (ssh -L 8000:localhost:8000 atl@SERVER). The firewall
# opens SSH only, and nothing else is published.
name: atl

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-database-url: &database-url
  ATL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_trading_lab}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}@db:5432/${POSTGRES_DB:-ai_trading_lab}

services:
  db:
    image: postgres:17.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_trading_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: ${POSTGRES_DB:-ai_trading_lab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # One-shot: brings the schema to the version this image expects, then exits.
  migrate:
    build: .
    image: atl-app:${ATL_IMAGE_TAG:-local}
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment:
      <<: *database-url
      ATL_EXECUTION_MODE: PAPER_ONLY
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  live:
    build: .
    image: atl-app:${ATL_IMAGE_TAG:-local}
    command: ["/app/.venv/bin/atl-live", "run", "--until-stopped"]
    environment:
      <<: *database-url
      # Fixed here on purpose: a typo in the env file can never enable anything else.
      ATL_EXECUTION_MODE: PAPER_ONLY
      # The AI strategy exists only when all four are set deliberately (docs/29 section 11).
      ATL_AI_ENABLED: ${ATL_AI_ENABLED:-false}
      ATL_AI_TOTAL_LIMIT_USD: ${ATL_AI_TOTAL_LIMIT_USD:-0}
      ATL_AI_REVIEWED_PRICES: ${ATL_AI_REVIEWED_PRICES:-[]}
      ATL_AI_PRICE_MAX_AGE_DAYS: ${ATL_AI_PRICE_MAX_AGE_DAYS:-14}
      ATL_OPENAI_API_KEY: ${ATL_OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # A cycle in flight is allowed to finish after SIGTERM.
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "/app/.venv/bin/atl-live", "health", "--max-age-minutes", "40"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 10m
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  # The dashboard: read models over the loop's tables, plus the audited on/off switches. It has no
  # OpenAI key and no way to place anything: it can only read, flip a strategy flag and acknowledge errors.
  dashboard:
    build: .
    image: atl-app:${ATL_IMAGE_TAG:-local}
    command: ["/app/.venv/bin/atl-dashboard", "serve"]
    environment:
      <<: *database-url
      ATL_EXECUTION_MODE: PAPER_ONLY
      ATL_AI_ENABLED: ${ATL_AI_ENABLED:-false}
      ATL_AI_TOTAL_LIMIT_USD: ${ATL_AI_TOTAL_LIMIT_USD:-0}
      ATL_DASHBOARD_PASSWORD_HASH: ${ATL_DASHBOARD_PASSWORD_HASH:-}
      ATL_DASHBOARD_SESSION_SECRET: ${ATL_DASHBOARD_SESSION_SECRET:-}
      ATL_DASHBOARD_IDLE_MINUTES: ${ATL_DASHBOARD_IDLE_MINUTES:-30}
      ATL_DEPLOYED_COMMIT: ${ATL_IMAGE_TAG:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

volumes:
  postgres_data:
