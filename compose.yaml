services:
  db:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_trading_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_example_only}
      POSTGRES_DB: ${POSTGRES_DB:-ai_trading_lab}
    ports:
      - "127.0.0.1:${ATL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      ATL_REPORTING_USERNAME: ${ATL_REPORTING_USERNAME:-}
      ATL_REPORTING_PASSWORD: ${ATL_REPORTING_PASSWORD:-}
      ATL_EXECUTION_MODE: ${ATL_EXECUTION_MODE:-PAPER_ONLY}
      ATL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_trading_lab}:${POSTGRES_PASSWORD:-local_example_only}@db:5432/${POSTGRES_DB:-ai_trading_lab}
      ATL_DATABASE_TIMEOUT_SECONDS: ${ATL_DATABASE_TIMEOUT_SECONDS:-2}
    ports:
      - "127.0.0.1:${ATL_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
volumes:
  postgres_data:
